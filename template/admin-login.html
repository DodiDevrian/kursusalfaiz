<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Admin - AL Faiz</title>
  <!-- Google Fonts & Bootstrap 5 & FontAwesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5" style="background: linear-gradient(135deg, #1c1919 0%, #0c0b0b 100%);">

  <div class="auth-card shadow-lg bg-white border border-secondary-subtle">
    <div class="text-center mb-4">
      <span class="badge bg-danger text-white px-3 py-1 mb-2 font-heading small">PORTAL ADMINISTRATOR</span>
      <h2 class="font-heading text-primary-custom mb-1" style="font-weight: 800; letter-spacing: 2px;">AL FAIZ</h2>
      <p class="text-muted small">Kelola Kursus, Siswa, & Konten Website</p>
    </div>

    <form id="admin-login-form" action="admin-dashboard.html">
      <div class="mb-3">
        <label for="email" class="form-label font-heading text-muted small" style="font-weight: 600;">EMAIL ADMINISTRATOR</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 border-color"><i class="fa-solid fa-user-shield text-muted"></i></span>
          <input type="email" class="form-control form-control-custom border-start-0 ps-0" id="email" placeholder="admin@email.com" value="admin@alfaiz.com" required>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label font-heading text-muted small" style="font-weight: 600;">KATA SANDI SECURE</label>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 border-color"><i class="fa-solid fa-lock text-muted"></i></span>
          <input type="password" class="form-control form-control-custom border-start-0 ps-0" id="password" placeholder="••••••••" value="admin123" required>
        </div>
      </div>

      <button type="submit" class="btn btn-danger w-100 py-2.5 font-heading text-white border-0" style="background-color: var(--primary); letter-spacing: 1px;">MASUK SECURE</button>
    </form>

    <div class="text-center mt-4">
      <a href="index.html" class="text-muted small text-decoration-none"><i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Home</a>
    </div>
  </div>

  <!-- JS Dependencies -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
