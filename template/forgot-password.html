<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Kata Sandi - AL Faiz</title>
  <!-- Google Fonts & Bootstrap 5 & FontAwesome -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5 bg-light-custom" style="background: linear-gradient(135deg, var(--dark-red) 0%, #1a0000 100%);">

  <div class="auth-card shadow-lg bg-white">
    <div class="text-center mb-4">
      <h2 class="font-heading text-primary-custom mb-1" style="font-weight: 800; letter-spacing: 2px;">AL FAIZ</h2>
      <p class="text-muted small">Atur Ulang Kata Sandi Akun Anda</p>
    </div>

    <!-- Alert Messages -->
    <div id="success-box" class="alert alert-success d-none" role="alert"></div>

    <form id="forgot-form">
      <div class="mb-4">
        <label for="email" class="form-label font-heading text-muted small" style="font-weight: 600;">ALAMAT EMAIL</label>
        <p class="text-muted small mb-2">Masukkan alamat email terdaftar Anda. Kami akan mengirimkan instruksi untuk mengatur ulang kata sandi.</p>
        <div class="input-group">
          <span class="input-group-text bg-transparent border-end-0 border-color"><i class="fa-solid fa-envelope text-muted"></i></span>
          <input type="email" class="form-control form-control-custom border-start-0 ps-0" id="email" placeholder="nama@email.com" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary-custom w-100 py-2.5 font-heading text-white border-0 bg-primary-custom" style="letter-spacing: 1px;">KIRIM LINK INSTALASI</button>
    </form>

    <div class="text-center mt-4">
      <p class="text-muted small mb-0">Sudah ingat sandi? <a href="login.html" class="text-gold font-heading text-decoration-none" style="font-weight: 600;">Kembali Masuk</a></p>
    </div>
  </div>

  <!-- JS Dependencies -->
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    $(document).ready(function() {
      $('#forgot-form').on('submit', function(e) {
        e.preventDefault();
        const successBox = $('#success-box');
        successBox.removeClass('d-none').text('Tautan pemulihan kata sandi telah dikirim ke email Anda! Silakan periksa kotak masuk.');
        $('#forgot-form')[0].reset();
      });
    });
  </script>
</body>
</html>
